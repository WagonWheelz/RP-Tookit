<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>MockChat Studio</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="vendor/daisyui/daisyui.css">
<link rel="stylesheet" href="css/editor.css">
<link rel="stylesheet" href="css/phone.css">
<link rel="stylesheet" href="css/imessage.css">
<link rel="stylesheet" href="css/tiktok.css">
<link rel="stylesheet" href="css/youtube.css">
<link rel="stylesheet" href="css/pornhub.css">
<link rel="stylesheet" href="css/toolkit-theme.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <a class="d-btn d-btn-sm d-btn-ghost back-home" href="../index.html" data-tip="Back to the RP-Toolkit">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span class="wide-only">Back to toolkit</span><span class="narrow-only">Back</span>
    </a>

    <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i></span>MockChat Studio</div>

    <div class="seg d-tabs d-tabs-box d-tabs-sm" id="platformSeg" role="tablist" aria-label="Platform">
      <button class="d-tab" role="tab" data-platform="imessage" data-tip="iMessage chat">iMessage</button>
      <button class="d-tab" role="tab" data-platform="tiktok" data-tip="A TikTok video in the feed, with its comments">TikTok</button>
      <button class="d-tab" role="tab" data-platform="tiktoklive" data-tip="A TikTok LIVE stream: comments, gifts, floating reactions">TT&nbsp;Live</button>
      <button class="d-tab" role="tab" data-platform="youtube" data-tip="A YouTube watch page: player, title, channel, description and the rail">YouTube</button>
      <button class="d-tab" role="tab" data-platform="pornhub" data-tip="A tube-style watch page: player, title, vote bar, uploader and related rail">Pornhub</button>
    </div>
    <div class="seg d-tabs d-tabs-box d-tabs-sm" id="themeSeg" role="tablist" aria-label="Phone light or dark">
      <button class="d-tab" role="tab" data-theme="light" data-tip="Light mode on the phone">Light</button>
      <button class="d-tab" role="tab" data-theme="dark" data-tip="Dark mode on the phone">Dark</button>
    </div>

    <div class="spacer"></div>

    <div class="progress-wrap" id="progWrap" hidden>
      <span class="d-loading d-loading-spinner d-loading-xs" aria-hidden="true"></span>
      <progress class="d-progress d-progress-primary" id="progBar" value="0" max="100" aria-label="Export progress"></progress>
      <button class="d-btn d-btn-xs d-btn-ghost" id="progCancel" hidden data-tip="Stop this export">Cancel</button>
    </div>
    <button class="d-btn d-btn-sm d-btn-ghost" id="btnPeople" data-tip="Your saved people: names, handles, pictures — one click to reuse anywhere">People</button>
    <button class="d-btn d-btn-sm d-btn-ghost" id="btnTemplates" data-tip="Open, back up and share your projects">Templates</button>
    <button class="d-btn d-btn-sm" id="btnSave" data-tip="Save this project as a template (Ctrl+S)">Save</button>
    <button class="d-btn d-btn-sm d-btn-primary d-btn-soft" id="btnPng" data-tip="Export a still image of what the preview shows"><span class="wide-only">Export image…</span><span class="narrow-only">Image</span></button>
    <button class="d-btn d-btn-sm d-btn-primary" id="btnWebm" data-tip="Export the whole animation as a video"><span class="wide-only">Export video</span><span class="narrow-only">Video</span></button>

    <!-- the editor's own light/dark: a daisyUI theme controller (scripts/ui-css/daisyui.src.css) -->
    <label class="app-theme" data-tip="Light or dark editor (the phone has its own switch)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      <input type="checkbox" value="mockchat-night" class="d-toggle d-toggle-sm theme-controller" id="appTheme" aria-label="Dark editor">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </label>
  </header>

  <main class="main">

    <!-- ------------------------------------------------ messages -->
    <section class="col left" aria-label="Conversation">
      <div class="col-head">Conversation<span class="spacer"></span>
        <button class="d-btn d-btn-xs d-btn-ghost" id="btnClear" data-tip="Remove every message in this scene">clear</button>
      </div>
      <div class="scene-strip" id="sceneStrip"></div>
      <div class="col-body">
        <div class="msg-list" id="msgList"></div>
      </div>
      <div class="col-foot toolbox">
        <div class="add-grid" id="addGrid"></div>
      </div>
    </section>

    <!-- ------------------------------------------------ preview -->
    <section class="stage-wrap" id="stageWrap" aria-label="Preview">
      <div class="stage-toolbar">
        <div class="transport" role="group" aria-label="Playback">
          <button class="tbtn d-btn d-btn-ghost d-btn-sm d-btn-circle" id="tpPrev" data-tip="Previous step (←)" aria-label="Previous step"><svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="2.5" height="14" rx="1"/><path d="M19 5.8v12.4a1 1 0 0 1-1.5.86L8.6 13.7a2 2 0 0 1 0-3.4l8.9-5.36A1 1 0 0 1 19 5.8z"/></svg></button>
          <button class="tbtn d-btn d-btn-ghost d-btn-sm d-btn-circle" id="tpScene" data-tip="Preview this scene, starting just before the selected message (Shift+Space)" aria-label="Preview this scene"><svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.2 8.6v6.8l5.4-3.4z"/></svg></button>
          <button class="tbtn play d-btn d-btn-primary d-btn-sm d-btn-circle" id="tpPlay" data-tip="Play everything from the start (Space)" aria-label="Play everything"><svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.52.85l10.2-6.4a1 1 0 0 0 0-1.7L9.52 4.75A1 1 0 0 0 8 5.6z"/></svg></button>
          <button class="tbtn d-btn d-btn-ghost d-btn-sm d-btn-circle" id="tpNext" data-tip="Next step (→)" aria-label="Next step"><svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><rect x="16.5" y="5" width="2.5" height="14" rx="1"/><path d="M5 5.8v12.4a1 1 0 0 0 1.5.86l8.9-5.36a2 2 0 0 0 0-3.4L6.5 4.94A1 1 0 0 0 5 5.8z"/></svg></button>
        </div>
        <span class="tsep"></span>
        <button class="tbtn text d-btn d-btn-ghost d-btn-xs" id="tpStep" data-tip="Step view: show the conversation up to the selected message. Off: show all of it">Steps</button>
        <span class="tread" id="tpRead"></span>
        <span class="tsep"></span>
        <button class="tbtn d-btn d-btn-ghost d-btn-sm d-btn-circle" id="zoomOut" data-tip="Zoom out" aria-label="Zoom out">−</button>
        <span id="zoomLabel" class="zoom-label">100%</span>
        <button class="tbtn d-btn d-btn-ghost d-btn-sm d-btn-circle" id="zoomIn" data-tip="Zoom in" aria-label="Zoom in">+</button>
        <button class="tbtn text d-btn d-btn-ghost d-btn-xs" id="zoomFit" data-tip="Fit the phone to the window">fit</button>
      </div>
      <div id="previewBox"><div id="preview"></div></div>
    </section>

    <!-- ------------------------------------------------ inspector -->
    <section class="col right" aria-label="Inspector">
      <div class="tabs d-tabs d-tabs-box d-tabs-sm" id="tabs" role="tablist">
        <button data-tab="message" class="d-tab d-tab-active on" role="tab">Message</button>
        <button class="d-tab" data-tab="chat" role="tab">Chat</button>
        <button class="d-tab" data-tab="video" role="tab">Video</button>
        <button class="d-tab" data-tab="style" role="tab">Style</button>
        <button class="d-tab" data-tab="timeline" role="tab" data-tip="This scene's timing and transitions, and the pacing of the whole thing">Timing</button>
        <button class="d-tab" data-tab="export" role="tab">Export</button>
      </div>
      <div class="col-body" id="inspector"></div>
    </section>

  </main>

  <!-- narrow screens only: switches between the three panels above -->
  <nav class="mobile-nav d-dock d-dock-sm" id="mobileNav" aria-label="Panels">
    <button data-pane="list"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg><span class="d-dock-label">Messages</span></button>
    <button data-pane="preview"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg><span class="d-dock-label">Preview</span></button>
    <button data-pane="edit"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span class="d-dock-label">Edit</span></button>
  </nav>

  <footer class="statusline">
    <span id="statusMain">Ready</span>
    <span class="spacer"></span>
    <span id="statusPaths"></span>
    <span id="appVersion" class="ver"></span>
  </footer>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="modalHost"></div>

<!-- the browser stand-in for the desktop bridge; does nothing under Electron -->
<script src="js/version.js"></script>
<script src="js/platform/web.js"></script>

<!-- third-party, vendored and pinned (see vendor/README.md) -->
<script src="vendor/fflate/fflate.js"></script>
<script src="vendor/html-to-image/html-to-image.js"></script>
<script src="vendor/webm-muxer/webm-muxer.js"></script>
<script src="vendor/mp4-muxer/mp4-muxer.js"></script>

<!-- the phone and its animation engine (shared with the export renderer) -->
<script src="js/core/html.js"></script>
<script src="js/core/clock.js"></script>
<script src="js/core/icons.js"></script>
<script src="js/core/mediaref.js"></script>
<script src="js/core/emojidata.js"></script>
<script src="js/core/emoji.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/render.js"></script>
<script src="js/core/tiktok.js"></script>
<script src="js/core/youtube.js"></script>
<script src="js/core/pornhub.js"></script>
<script src="js/core/timeline.js"></script>
<script src="js/core/scenes.js"></script>
<script src="js/core/metastrip.js"></script>

<!-- in-page export (web build) -->
<script src="js/export/gifenc.js"></script>
<script src="js/export/webpmux.js"></script>
<script src="js/export/webexport.js"></script>

<!-- the editor -->
<script src="js/editor/core.js"></script>
<script src="js/editor/fields.js"></script>
<script src="js/editor/preview.js"></script>
<script src="js/editor/messages.js"></script>
<script src="js/editor/scenestrip.js"></script>
<script src="js/editor/people.js"></script>
<script src="js/editor/fit.js"></script>
<script src="js/editor/inspector.js"></script>
<script src="js/editor/files.js"></script>
<script src="js/editor/exports.js"></script>
<script src="js/editor/main.js"></script>
</body>
</html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generic Agency</title>
  <link rel="icon" href="../Assets/favicon.png" type="image">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,400;0,600;0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <style>
    .options { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end; margin-bottom: 24px; }
    .options label { display: flex; flex-direction: column; gap: 8px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.08em; color: #ffffff; }
    .options input[type="color"] { width: 72px; height: 40px; padding: 2px; border: 1px solid #2a211e; background: #ffffff; cursor: pointer; }
    .options input[type="file"] { color: #ffffff; font-family: inherit; }
    .logo-message { color: #f87171; margin: -12px 0 24px; min-height: 1.2em; }
    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <div class="overlay">
    <header class="topbar">
      <div class="wrap topbar-main">
        <span class="mark">GEN</span>
        <span class="brand-name">Generic Agency</span>
        <span class="spacer"></span>
        <a class="home" href="../index.html">Back to toolkit</a>
      </div>
      <nav class="wrap nav-links" aria-label="Creators">
            <a class="nav-link" href="./generic.html">Overview</a>
            <a class="nav-link" href="./title.html">Title</a>
            <a class="nav-link active" href="./signature.html">Signature</a>
            <a class="nav-link" href="./header.html">Header</a></nav>
    </header>

    <!-- Page Content -->
    <div class="container ">
      <!-- Design picker (reuses the rank-button styling) -->
      <div class="row justify-content-between mt-3 px-2 ranks styles">
        <input type="button" name="classic" value="Classic" class="btn-active">
        <input type="button" name="modern" value="New">
      </div>

      <!-- Canvas -->
      <div>
        <canvas class="canvas my-5"></canvas>
      </div>

      <!-- Colours: each picker only shows for the design that uses it -->
      <form class="options colours">
        <label data-style="classic">Primary colour
          <input type="color" name="classicPrimary" value="#1a812c">
        </label>
        <label data-style="classic">Shade colour
          <input type="color" name="classicShade" value="#143519">
        </label>
        <label data-style="modern">Panel colour
          <input type="color" name="modernPanel" value="#2a2a2a">
        </label>
        <label data-style="modern">Accent stripe
          <input type="color" name="modernAccent" value="#c40304">
        </label>
        <label data-style="modern">Thin stripe
          <input type="color" name="modernStripe" value="#ffffff">
        </label>
        <label>Text colour
          <input type="color" name="text" value="#ffffff">
        </label>
      </form>

      <!-- Logo -->
      <div class="options">
        <label>Logo / badge (PNG with a transparent background works best)
          <input type="file" class="logo-file" accept="image/png,image/jpeg,image/webp,image/svg+xml">
        </label>
        <button type="button" class="btn logo-remove" hidden>Remove logo</button>
      </div>
      <p class="logo-message"></p>

      <!-- Inputs -->
      <form class="inputs my-4 form-group d-flex justify-content-center align-content-center flex-column text-sm-left">
        <div class="row">
          <div class="col-6 ">
            <label>Name</label>
            <input type="text" class="form-control" name='fullname' spellcheck="false">
          </div>
          <div class="col-6" data-style="classic">
            <label>Badge Number</label>
            <input type="text" class="form-control" name='badge' spellcheck="false">
          </div>
          <div class="col-6 ">
            <label>Rank</label>
            <input type="text" class="form-control" name='rank' spellcheck="false">
          </div>
          <div class="col-6" data-style="classic">
            <label>Callsign</label>
            <input type="text" class="form-control" name='callsign' spellcheck="false">
          </div>
        </div>
        <label>Divisions/Office</label>
        <input type="text" class="form-control" name='line1' spellcheck="false">
        <label>Divisions/Office</label>
        <input type="text" class="form-control" name="line2" spellcheck="false">
      </form>

    </div>
  </div>


  <script src="./js/signature.js"></script>
  </body>

</html>
